# Builds the site on every pull request, and publishes it to Cloudflare Pages on
# every push to main. One workflow, because it is one build: the deploy is the
# same steps with an upload on the end.
#
# The build is the check. A missing translation key and a dead link both throw
# during a production build, so a failure never reaches the deploy step. See
# bootstrap.php and scripts/links/check.php.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

  push:
    branches: [main]

  # So a deploy that failed on a flaky network call is repeatable without an
  # empty commit.
  workflow_dispatch:

# A superseded pull request run is cancelled. A superseded deploy is not: one
# production deploy at a time, because a half-finished upload is worse than a
# stale one.
concurrency:
  group: ${{ case(github.event_name == 'pull_request', format('ci-{0}', github.ref), 'cloudflare-pages-production') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ case(github.event_name == 'pull_request', 'Build and check links', 'Build and deploy') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lets wrangler put the live URL on the commit in GitHub's UI.
      deployments: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's own PHP is 8.3, and composer.lock resolves to Symfony 8,
      # which needs 8.4.1.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install PHP dependencies
        # `--no-dev` on both events: composer.json declares no require-dev, so a
        # condition here would only look like it meant something.
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Install node dependencies
        run: npm ci

      - name: Build the site
        # Only lifts the GitHub API rate limit for the star count, which is
        # shared with everything else on this runner's IP. A failed call falls
        # back to the figure in config.php.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        # Cloudflare builds nothing: a Pages build image has no PHP, so it
        # receives the finished build_production/ directory.
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Explicit `--branch`, because wrangler otherwise infers it from the
          # checkout and publishes a preview instead of the live site.
          command: pages deploy build_production --project-name=marketing --branch=main

      # Two zone redirect rules answer `/`, the one URL no file answers. Applied
      # after the upload so the pages they point at exist first, then verified
      # against the live site. See cloudflare/redirect-rules.md.
      #
      # A second token, because this needs Zone > Single Redirect > Edit, which
      # the Pages upload has no business holding.
      - name: Apply the root's redirect rules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_RULES_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: scripts/cloudflare/apply-redirect-rules.sh ${{ case(github.event_name == 'pull_request', '--dry-run', '') }}
