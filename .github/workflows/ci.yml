# Builds the site on every pull request, and publishes it to Cloudflare Pages
# on every push to main.
#
# One workflow, because it is one build. The deploy is the same six steps as
# the check with an upload on the end, and while they lived in two files the
# only thing keeping them honest was that nobody edited one and forgot the
# other.
#
# The build is the check. Jigsaw has no type checker, so this repository puts
# its invariants in the build itself: a missing translation key throws, and so
# does a dead link (see bootstrap.php and scripts/links/check.php). Running
# `npm run build` here is what turns those into a red cross on the pull
# request, and on main it is what stops a broken page from shipping, because a
# failure never reaches the deploy step.
#
# `production` is deliberate. It is the environment that resolves baseUrl to the
# real domain, and the one where the link check is strict rather than advisory.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

  push:
    branches: [main]

  # A deploy that failed on a flaky network call should be repeatable without
  # an empty commit.
  workflow_dispatch:

# The two events want opposite things here, so both keys are conditional.
#
# On a pull request, a second push to the same branch makes the first run
# irrelevant, so it is cancelled. On main it is not: one production deploy at a
# time, and a half-finished upload is worse than a superseded one, since the
# next push deploys over it anyway.
concurrency:
  group: ${{ case(github.event_name == 'pull_request', format('ci-{0}', github.ref), 'cloudflare-pages-production') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Reads as "Build and check links" on a pull request and "Build and deploy"
    # everywhere else, which is the difference the run actually made.
    name: ${{ case(github.event_name == 'pull_request', 'Build and check links', 'Build and deploy') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lets wrangler record the deployment against the commit, which is what
      # puts the live URL on the commit in GitHub's UI. Unused on a pull
      # request, where the deploy step does not run.
      deployments: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's own PHP is 8.3, and composer.lock resolves to Symfony 8,
      # which needs 8.4.1. composer.json says so; this is where it is honoured.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # `--no-dev` on both events rather than only on the deploy: composer.json
      # declares no require-dev, so it resolves to the same vendor directory
      # either way, and a condition here would only look like it meant
      # something.
      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Install node dependencies
        run: npm ci

      - name: Build the site
        # Only lifts the GitHub API rate limit for the star count, which is
        # shared across everything else running on this runner's IP. The build
        # falls back to the figure in config.php if the call fails, so a rate
        # limit shows a stale number rather than failing the deploy.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      # Cloudflare builds nothing. It receives the finished `build_production/`
      # directory, because a Pages build image has no PHP and therefore no
      # Jigsaw.
      - name: Deploy to Cloudflare Pages
        # A pull request stops at the build. A push to main and a manual run
        # both publish.
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # `--branch` is explicit because wrangler otherwise infers it from the
          # checkout, and anything other than the project's production branch
          # publishes a preview instead of the live site.
          command: pages deploy build_production --project-name=marketing --branch=main

      # The root is the one URL no file answers: two zone redirect rules read
      # Accept-Language and send the reader to their own language. This carries
      # cloudflare/redirect-rules.json to the zone and then checks that the edge
      # answers with it, so a mistyped expression is a red deploy rather than a
      # quiet English homepage for everybody.
      #
      # It runs after the upload on purpose, so the pages the rules point at exist
      # before anything is redirected to them. It touches only its own two rules,
      # and does nothing at all when they already match the file.
      #
      # The token is a second one, not the token above: this needs
      # Zone > Single Redirect > Edit on monicahq.com, which the Pages deploy has
      # no business holding. Both secrets have to exist or this step fails, which
      # is the intended way to find out that the rules are not being applied.
      - name: Apply the root's redirect rules
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_RULES_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: scripts/cloudflare/apply-redirect-rules.sh

      # The redirect rules the deploy applies to the zone. No credentials here on
      # purpose: a pull request has no business writing to Cloudflare, and without
      # them the script validates the file and prints what it would send, which is
      # what catches a malformed definition before it reaches a deploy. The build
      # above has already checked that the file and config.php agree on the
      # languages.
      - name: Check the redirect rules definition
        if: github.event_name == 'pull_request'
        run: scripts/cloudflare/apply-redirect-rules.sh --dry-run
