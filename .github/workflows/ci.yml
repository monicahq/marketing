# Builds the site the way a deploy would, on every pull request.
#
# The build is the check. Jigsaw has no type checker, so this repository puts
# its invariants in the build itself: a missing translation key throws, and so
# does a dead link (see bootstrap.php and scripts/links/check.php). Running
# `npm run build` here is what turns those into a red cross on the pull request.
#
# `production` is deliberate. It is the environment that resolves baseUrl to the
# real domain, and the one where the link check is strict rather than advisory.
name: CI

# Pull requests only. A push to main runs the same build inside
# `deploy.yml`, where a failure also stops the deploy, so running it here as
# well would build main twice and prove nothing the deploy has not.
on:
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The runner's own PHP is 8.3, and composer.lock resolves to Symfony 8,
      # which needs 8.4.1. composer.json says so; this is where it is honoured.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install node dependencies
        run: npm ci

      - name: Build the site
        # Only lifts the GitHub API rate limit for the star count, which is
        # shared across everything else running on this runner's IP. The build
        # falls back to the figure in config.php if the call fails.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      # The redirect rules the deploy applies to the zone. No credentials here on
      # purpose: a pull request has no business writing to Cloudflare, and without
      # them the script validates the file and prints what it would send, which is
      # what catches a malformed definition before it reaches a deploy. The build
      # above has already checked that the file and config.php agree on the
      # languages.
      - name: Check the redirect rules definition
        run: scripts/cloudflare/apply-redirect-rules.sh --dry-run
